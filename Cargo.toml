[workspace]
resolver = "2"
members = [
    "crates/rahyab-core",
    "crates/rahyab-cli",
    "crates/rahyab-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

# mingw ld on this machine chokes on huge debug binaries — keep test links small.
[profile.test]
debug = 0
strip = true
