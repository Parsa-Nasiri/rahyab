[package]
name = "rahyab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rahyab combo-tester: probe the environment, race every candidate, scan for alive IPs"

[[bin]]
name = "rahyab"
path = "src/main.rs"

[dependencies]
rahyab-core = { path = "../rahyab-core" }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
async-trait = "0.1"
base64 = "0.22"
