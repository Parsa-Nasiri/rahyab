[package]
name = "rahyab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rahyab blackout-resilient VPN core: transports, probing, Khorshid algorithm"

[features]
default = ["wireguard"]
wireguard = ["dep:boringtun", "dep:smoltcp"]

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
arc-swap = "1"
base64 = "0.22"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
shadowsocks-crypto = "0.8"
boringtun = { version = "0.6", optional = true }
smoltcp = { version = "0.12", optional = true, default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }
